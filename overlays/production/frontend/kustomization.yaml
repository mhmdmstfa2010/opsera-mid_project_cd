apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/frontend

images:
  - name: frontend
    # Replace DOCKERHUB_NAMESPACE with your Docker Hub namespace
    # (the same value as the DOCKERHUB_NAMESPACE repo variable).
    newName: docker.io/DOCKERHUB_NAMESPACE/frontend
    newTag: 0.0.1 # CI rewrites this line: sed -i "s#newTag: .*#newTag: <git-sha>#"
